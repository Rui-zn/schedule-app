name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: CI
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试（数据层 + 自启）
        run: npm test

      - name: UI 端到端自检
        run: npm run test:ui

      - name: 打包 portable exe
        run: npm run dist

      - name: 规范资产文件名
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          Get-ChildItem dist\*.exe | Rename-Item -NewName "ScheduleApp-$v-portable.exe"

      - name: 上传构建产物（供预览）
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleApp-portable
          path: dist/ScheduleApp-*.exe
          retention-days: 7

      - name: 发布 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 日程表 ${{ github.ref_name }}
          files: dist/ScheduleApp-*.exe
          generate_release_notes: true
