name: diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - name: 诊断 WScript.Shell 快捷方式创建
        shell: pwsh
        run: |
          $dir = Join-Path $env:TEMP ('diag-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "dir=$dir"
          "TEMP=$env:TEMP"
          "USERPROFILE=$env:USERPROFILE"
          "culture=$([System.Globalization.CultureInfo]::CurrentCulture.Name)"
          "pwsh=$($PSVersionTable.PSVersion)"
          function Test-Shortcut([string]$name) {
            $ws = New-Object -ComObject WScript.Shell
            try {
              $lnk = Join-Path $dir $name
              $sc = $ws.CreateShortcut($lnk)
              $sc.TargetPath = 'C:\Windows\notepad.exe'
              $sc.Save()
              "OK  : $name"
            } catch {
              "FAIL: $name -> $($_.Exception.Message)"
            }
          }
          Test-Shortcut 'ascii-test.lnk'
          Test-Shortcut 'unicode-ri.lnk'
          $ps51 = "`$ws = New-Object -ComObject WScript.Shell; `$lnk = '$dir\unicode-51.lnk'; `$sc = `$ws.CreateShortcut(`$lnk); `$sc.TargetPath='C:\Windows\notepad.exe'; `$sc.Save(); Write-Output '51 OK'"
          $enc = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($ps51))
          & powershell.exe -NoProfile -NonInteractive -EncodedCommand $enc
          "ps51_exit=$LASTEXITCODE"
          node -e "const os=require('os'); console.log('node tmpdir:', os.tmpdir())"
