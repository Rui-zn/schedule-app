name: diag2

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 复现 autostart 失败路径
        shell: pwsh
        run: |
          node -e "
            const fs=require('fs'),os=require('os'),path=require('path');
            const {execFile}=require('child_process');
            const autostart=require('./src/main/autostart');
            function psEncode(s){return Buffer.from(s,'utf16le').toString('base64');}
            function psQuote(v){return \"'\"+String(v).replace(/'/g,\"''\")+\"'\";}
            function run(name, lnkPath, extra){
              const script=[
                \"`$ErrorActionPreference = 'Stop'\",
                '`$ws = New-Object -ComObject WScript.Shell',
                \"`$sc = `$ws.CreateShortcut(\"+psQuote(lnkPath)+\")\",
                \"`$sc.TargetPath = \"+psQuote(process.execPath),
                ...(extra||[]),
                '`$sc.Save()'
              ].join('\n');
              return new Promise((res)=>{
                execFile('powershell.exe',['-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-EncodedCommand',psEncode(script)],{timeout:15000,windowsHide:true},(err,so,se)=>{
                  res({name, ok:!err, msg: err?((se||so||err.message).trim().slice(0,200)):'OK'});
                });
              });
            }
            (async()=>{
              const dir=fs.mkdtempSync(path.join(os.tmpdir(),'ast-'));
              const startup=autostart.startupFolder(dir);
              fs.mkdirSync(startup,{recursive:true});
              console.log('startup dir exists:',fs.existsSync(startup),startup);
              const plain=path.join(dir,'plain-unicode.lnk');
              const nestedAscii=path.join(startup,'ascii-nested.lnk');
              const nestedUnicode=path.join(startup,'ri-nested.lnk');
              let r1=await run('plain unicode', plain);
              let r2=await run('nested(Start Menu) ascii', nestedAscii);
              let r3=await run('nested(Start Menu) unicode', nestedUnicode);
              console.log(JSON.stringify([r1,r2,r3],null,1));
              console.log('startup contents:',fs.readdirSync(startup));
              console.log('plain contents:',fs.readdirSync(dir));
            })();
          " 2>&1
